<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sower Creative</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #FAF5E9;
      background-image: radial-gradient(ellipse at 50% 45%, #F0E8D0 0%, #FAF5E9 65%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .monogram {
      width: 360px;
      height: auto;
      overflow: visible;
    }

    /* ── SEED — pops in first ── */
    #seed-group {
      transform-box: fill-box;
      transform-origin: center center;
      opacity: 0;
      transform: scale(0);
      animation: seedPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards;
    }

    @keyframes seedPop {
      to { opacity: 1; transform: scale(1); }
    }

    /* ── S PLANT — grows upward from seed ── */
    #s-group {
      clip-path: inset(100% 0% 0% 0%);
      animation: revealUp 1.0s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
    }

    /* ── C WHEAT — grows upward ── */
    #c-group {
      clip-path: inset(100% 0% 0% 0%);
      animation: revealUp 1.0s cubic-bezier(0.16, 1, 0.3, 1) 1.7s forwards;
    }

    @keyframes revealUp {
      from { clip-path: inset(100% 0% 0% 0%); }
      to   { clip-path: inset(0% 0% 0% 0%); }
    }

    /* ── WORDMARK ── */
    .wordmark {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .sower-text {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 58px;
      letter-spacing: 0.1em;
      color: #1B4332;
      line-height: 1;
      clip-path: inset(0% 100% 0% 0%);
      animation: revealRight 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
    }

    .rule {
      width: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, #D4A017 30%, #D4A017 70%, transparent);
      opacity: 0;
      animation: ruleExpand 0.5s ease-out 2.1s forwards;
    }

    @keyframes ruleExpand {
      to { width: 240px; opacity: 0.45; }
    }

    .creative-text {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 22px;
      letter-spacing: 0.42em;
      color: #D4A017;
      line-height: 1;
      text-transform: uppercase;
      clip-path: inset(0% 100% 0% 0%);
      animation: revealRight 0.7s cubic-bezier(0.16, 1, 0.3, 1) 2.5s forwards;
    }

    @keyframes revealRight {
      from { clip-path: inset(0% 100% 0% 0%); }
      to   { clip-path: inset(0% 0% 0% 0%); }
    }

    /* ── SUBTLE GOLD GLOW on C after it settles ── */
    #c-group {
      animation:
        revealUp 1.0s cubic-bezier(0.16, 1, 0.3, 1) 1.7s forwards,
        goldPulse 3s ease-in-out 3.0s infinite alternate;
    }

    @keyframes goldPulse {
      from { filter: drop-shadow(0 0 0px rgba(212, 160, 23, 0)); }
      to   { filter: drop-shadow(0 0 10px rgba(212, 160, 23, 0.3)); }
    }

    /* ── REPLAY ── */
    .replay-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: transparent;
      border: 1px solid rgba(27, 67, 50, 0.35);
      color: #1B4332;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 10px 22px;
      cursor: pointer;
      opacity: 0;
      transition: background 0.25s, color 0.25s, border-color 0.25s;
      animation: fadeBtn 0.5s ease 3.5s forwards;
    }

    .replay-btn:hover {
      background: #1B4332;
      color: #FAF5E9;
      border-color: #1B4332;
    }

    @keyframes fadeBtn {
      to { opacity: 1; }
    }
  </style>
</head>

      <span class="sower-text">SOWER</span>
      <div class="rule"></div>
      <span class="creative-text">CREATIVE</span>
    </div>

  </div>

  <button class="replay-btn" onclick="replayAll()">REPLAY</button>

  <script>
    function replayAll() {
      const els = document.querySelectorAll(
        '#seed-group, #s-group, #c-group, .sower-text, .rule, .creative-text, .replay-btn'
      );
      els.forEach(el => {
        el.style.animation = 'none';
        void el.offsetHeight; // force reflow
        el.style.animation = '';
      });
    }
  </script>
